services:
  visacoach-backend:
    build:
      context: ${VISACOACH_APP_DIR:-/opt/docker/apps/visacoach}
      dockerfile: backend.Dockerfile
    container_name: visacoach-backend
    restart: unless-stopped
    env_file:
      - "${DOCKER_DATA_DIR:-/opt/docker/data}/visacoach/backend.env"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=5000
      - CORS_ORIGINS=https://${VISACOACH_HOSTNAME?}
      - GOOGLE_CLIENT_ID=${VISACOACH_GOOGLE_CLIENT_ID:-}
    expose:
      - 5000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.visacoach-api.rule=Host(`${VISACOACH_HOSTNAME?}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.visacoach-api.entrypoints=websecure"
      - "traefik.http.routers.visacoach-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.visacoach-api.priority=100"
      - "traefik.http.routers.visacoach-api.service=visacoach-api"
      - "traefik.http.routers.visacoach-health.rule=Host(`${VISACOACH_HOSTNAME?}`) && Path(`/health`)"
      - "traefik.http.routers.visacoach-health.entrypoints=websecure"
      - "traefik.http.routers.visacoach-health.tls.certresolver=letsencrypt"
      - "traefik.http.routers.visacoach-health.priority=100"
      - "traefik.http.routers.visacoach-health.service=visacoach-api"
      - "traefik.http.services.visacoach-api.loadbalancer.server.port=5000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/live').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    profiles:
      - visacoach
      - all

  visacoach-frontend:
    build:
      context: ${VISACOACH_APP_DIR:-/opt/docker/apps/visacoach}
      dockerfile: frontend.Dockerfile
      args:
        - REACT_APP_API_BASE_URL=https://${VISACOACH_HOSTNAME?}
        - REACT_APP_GOOGLE_CLIENT_ID=${VISACOACH_GOOGLE_CLIENT_ID:-}
    container_name: visacoach-frontend
    restart: unless-stopped
    expose:
      - 80
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.visacoach.rule=Host(`${VISACOACH_HOSTNAME?}`)"
      - "traefik.http.routers.visacoach.entrypoints=websecure"
      - "traefik.http.routers.visacoach.tls.certresolver=letsencrypt"
      - "traefik.http.routers.visacoach.priority=1"
      - "traefik.http.routers.visacoach.service=visacoach"
      - "traefik.http.services.visacoach.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - visacoach
      - all
