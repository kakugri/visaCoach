<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">VisaCoach</title>
  <desc id="desc">Visa interview practice with focused feedback.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="1120" y2="590" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.52" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="74" y="70" width="1052" height="490" rx="34" fill="#ffffff" stroke="#dbeafe" filter="url(#shadow)"/>
  <g transform="translate(118 118)">
    <rect width="96" height="96" rx="24" fill="url(#brand)"/>
    <path d="M32 21h27l13 13v41a10 10 0 0 1-10 10H32a10 10 0 0 1-10-10V31a10 10 0 0 1 10-10z" fill="#ffffff"/>
    <path d="M59 21v13h13" fill="#bfdbfe"/>
    <path d="M37 44h25M37 57h13" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <path d="M39 72l8 8 18-22" fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="118" y="280" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="76" font-weight="800">VisaCoach</text>
  <text x="118" y="358" fill="#334155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="600">Visa interview practice in five minutes.</text>
  <text x="118" y="428" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30">Answer realistic questions, get focused feedback, and copy a useful summary.</text>
